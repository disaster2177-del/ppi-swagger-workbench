info:
  title: Swagger Petstore (sample)
  version: 1.0.27
  description: |
    Sample definition for the live Petstore server at https://petstore3.swagger.io.
    Use it to try out generated forms: enums, nested objects, arrays, $refs,
    path/query/header parameters, and request bodies.
servers:
  - url: https://petstore3.swagger.io/api/v3
    description: Public Petstore server
tags:
  - name: pet
    description: Everything about your Pets
  - name: store
    description: Access to Petstore orders
  - name: user
    description: Operations about user
paths:
  /pet:
    put:
      tags: [pet]
      summary: Update an existing pet
      operationId: updatePet
      requestBody:
        $ref: '#/components/requestBodies/Pet'
      responses:
        '200': { description: Successful operation }
        '400': { description: Invalid ID supplied }
        '404': { description: Pet not found }
    post:
      tags: [pet]
      summary: Add a new pet to the store
      operationId: addPet
      requestBody:
        $ref: '#/components/requestBodies/Pet'
      responses:
        '200': { description: Successful operation }
        '405': { description: Invalid input }
  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Finds Pets by status
      description: Multiple status values can be provided with comma separated strings.
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: false
          explode: true
          schema:
            type: string
            default: available
            enum: [available, pending, sold]
      responses:
        '200': { description: successful operation }
        '400': { description: Invalid status value }
  /pet/findByTags:
    get:
      tags: [pet]
      summary: Finds Pets by tags
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          description: Tags to filter by
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200': { description: successful operation }
  /pet/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [pet]
      summary: Find pet by ID
      operationId: getPetById
      security:
        - api_key: []
      responses:
        '200': { description: successful operation }
        '404': { description: Pet not found }
    post:
      tags: [pet]
      summary: Updates a pet in the store with form data
      operationId: updatePetWithForm
      parameters:
        - name: name
          in: query
          description: Name of pet that needs to be updated
          schema: { type: string }
        - name: status
          in: query
          description: Status of pet that needs to be updated
          schema: { $ref: '#/components/schemas/PetStatus' }
      responses:
        '405': { description: Invalid input }
    delete:
      tags: [pet]
      summary: Deletes a pet
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          required: false
          schema: { type: string }
      responses:
        '400': { description: Invalid pet value }
  /pet/{petId}/uploadImage:
    post:
      tags: [pet]
      summary: Uploads an image
      operationId: uploadFile
      parameters:
        - $ref: '#/components/parameters/PetId'
        - name: additionalMetadata
          in: query
          required: false
          schema: { type: string }
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200': { description: successful operation }
  /store/inventory:
    get:
      tags: [store]
      summary: Returns pet inventories by status
      operationId: getInventory
      security:
        - api_key: []
      responses:
        '200': { description: successful operation }
  /store/order:
    post:
      tags: [store]
      summary: Place an order for a pet
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '200': { description: successful operation }
        '405': { description: Invalid input }
  /store/order/{orderId}:
    parameters:
      - name: orderId
        in: path
        description: ID of the order (1–10 have data)
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 10
          example: 3
    get:
      tags: [store]
      summary: Find purchase order by ID
      operationId: getOrderById
      responses:
        '200': { description: successful operation }
        '404': { description: Order not found }
    delete:
      tags: [store]
      summary: Delete purchase order by ID
      operationId: deleteOrder
      responses:
        '400': { description: Invalid ID supplied }
        '404': { description: Order not found }
  /user:
    post:
      tags: [user]
      summary: Create user
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        default: { description: successful operation }
  /user/login:
    get:
      tags: [user]
      summary: Logs user into the system
      operationId: loginUser
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string, minLength: 1, example: theUser }
        - name: password
          in: query
          required: true
          schema: { type: string, format: password, example: '12345' }
      responses:
        '200': { description: successful operation }
        '400': { description: Invalid username/password supplied }
  /user/{username}:
    parameters:
      - name: username
        in: path
        description: The name that needs to be fetched. Use user1 for testing.
        required: true
        schema: { type: string, example: user1 }
    get:
      tags: [user]
      summary: Get user by user name
      operationId: getUserByName
      responses:
        '200': { description: successful operation }
        '404': { description: User not found }
    put:
      tags: [user]
      summary: Update user
      operationId: updateUser
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        default: { description: successful operation }
    delete:
      tags: [user]
      summary: Delete user
      operationId: deleteUser
      responses:
        '400': { description: Invalid username supplied }
        '404': { description: User not found }
components:
  parameters:
    PetId:
      name: petId
      in: path
      description: ID of the pet
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 10
  requestBodies:
    Pet:
      description: Pet object that needs to be added to the store
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pet' }
  schemas:
    PetStatus:
      type: string
      description: pet status in the store
      enum: [available, pending, sold]
    Category:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Dogs, maxLength: 50 }
    Tag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Pet:
      type: object
      required: [name, photoUrls]
      properties:
        id: { type: integer, format: int64, example: 10 }
        name: { type: string, example: doggie, minLength: 1, maxLength: 100 }
        category: { $ref: '#/components/schemas/Category' }
        photoUrls:
          type: array
          minItems: 1
          items: { type: string, example: 'https://example.com/dog.png' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        status: { $ref: '#/components/schemas/PetStatus' }
    Order:
      type: object
      properties:
        id: { type: integer, format: int64, example: 10 }
        petId: { type: integer, format: int64, example: 198772 }
        quantity: { type: integer, format: int32, minimum: 1, maximum: 100, default: 1 }
        shipDate: { type: string, format: date-time, example: '2026-10-06T10:00:00Z' }
        status:
          type: string
          description: Order Status
          enum: [placed, approved, delivered]
          example: approved
        complete: { type: boolean, default: false }
    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 10 }
        username: { type: string, example: theUser }
        firstName: { type: string, example: John }
        lastName: { type: string, example: James }
        email: { type: string, format: email, example: john@email.com }
        password: { type: string, format: password, minLength: 4 }
        phone: { type: string, example: '12345' }
        userStatus: { type: integer, format: int32, description: User Status, example: 1 }
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: header
      description: Any value works on the public Petstore server (try "special-key").
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes:
