# Run on a VM (or any Docker host):
#   cp .env.example .env        # set SETTINGS_SECRET_KEY, APP_PORT, proxy, ...
#   docker compose up -d --build
#   open http://<vm-address>:<APP_PORT>      (default port 4000)
#
# With the PPI simulator:   docker compose --profile sim up -d --build
# With Kafka UI (:8080):    docker compose --profile tools up -d
#
# Each user's projects and YAML files are stored in their own browser, not in
# these containers. MongoDB keeps the PPI history and the shared Settings.
services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    container_name: kafka
    restart: unless-stopped
    ports:
      # Only reachable from the VM itself unless KAFKA_BIND is set to 0.0.0.0.
      - "${KAFKA_BIND:-127.0.0.1}:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # Producers outside Docker connect to EXTERNAL; set KAFKA_EXTERNAL_HOST to the VM's address for remote producers.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  mongo:
    image: ${MONGO_IMAGE:-mongo:7.0}
    container_name: mongo
    restart: unless-stopped
    ports:
      # MongoDB has no password here, so it is only published on the VM's loopback.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    # Built locally (docker compose build) or loaded from the offline bundle (docker load).
    image: ppi-workbench:${APP_VERSION:-latest}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: ppi-workbench
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
    ports:
      # The URL users open: http://<vm-address>:${APP_PORT}
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-4000}:4000"
    extra_hosts:
      # Lets the API proxy reach services running on the VM itself as http://host.docker.internal:<port>
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/naval_geometry
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPICS: ${KAFKA_TOPICS:-radar.geometry,radar.tracks,radar.ownship,radar.legacy-plots:legacyPlot,radar.nmea:nmea0183,ais.nmea:nmea0183,c2.zones}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:4000}
      # Encrypts API credentials saved in Settings. Set your own long random value in .env.
      SETTINGS_SECRET_KEY: ${SETTINGS_SECRET_KEY:?Set SETTINGS_SECRET_KEY in .env (see .env.example)}
      # Outbound proxy for "Execute" (leave empty if the VM has direct internet access).
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,mongo,kafka,host.docker.internal}
      # Optional: only allow the request proxy to call these hosts (comma list, *.suffix allowed).
      WORKBENCH_ALLOWED_HOSTS: ${WORKBENCH_ALLOWED_HOSTS:-}
      # Optional: extra CA certificate for APIs behind a company CA (mount it, see docs/DEPLOY.md).
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  simulator:
    # Same image as the app.
    image: ppi-workbench:${APP_VERSION:-latest}
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
    command: ["node", "scripts/simulator.js"]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["tools"]
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  mongo-data:
