<title>PPI &amp; Swagger Workbench</title>
<style>
/* Layout: slim console bar over a two-pane split — PPI left, Swagger right — with a draggable divider; stacks into tabs on phones */
:root{
  --bg:#eef1f4; --bar:#ffffff; --line:#d5dbe2; --fg:#16202a; --muted:#5f6c79;
  --accent:#0f8f6a; --accent-soft:#0f8f6a1f; --grip:#b9c2cc;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070d13; --bar:#0b1620; --line:#1c3242; --fg:#d3e4ee; --muted:#7b93a3;
  --accent:#34d399; --accent-soft:#34d39922; --grip:#2a4658; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070d13; --bar:#0b1620; --line:#1c3242; --fg:#d3e4ee; --muted:#7b93a3;
  --accent:#34d399; --accent-soft:#34d39922; --grip:#2a4658; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--sans);display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--bar);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.labels{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.labels button{font:500 12px var(--mono);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
.labels button:hover{color:var(--fg);border-color:var(--accent)}
.labels button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.labels button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ratio{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.split{flex:1;min-height:0;display:grid;grid-template-columns:var(--left,50%) 8px minmax(0,1fr)}
.pane{min-width:0;min-height:0;position:relative;display:flex;flex-direction:column}
.pane-head{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bar);border-bottom:1px solid var(--line)}
.pane-head b{color:var(--fg);font-weight:600}
iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}
.grip{cursor:col-resize;background:var(--bar);border-inline:1px solid var(--line);position:relative;touch-action:none}
.grip::after{content:"";position:absolute;inset:50% 2px auto;height:40px;transform:translateY(-50%);border-inline:1px solid var(--grip);margin-inline:auto;width:2px}
.grip:hover,.grip.drag,.grip:focus-visible{background:var(--accent-soft);outline:none}
.split.dragging iframe{pointer-events:none}
.split[data-solo="ppi"]{grid-template-columns:minmax(0,1fr) 0 0}
.split[data-solo="swagger"]{grid-template-columns:0 0 minmax(0,1fr)}
.split[data-solo="ppi"] .grip,.split[data-solo="swagger"] .grip{display:none}
.split[data-solo="ppi"] #pane-swagger,.split[data-solo="swagger"] #pane-ppi{display:none}
@media (max-width:760px){
  .split,.split[data-solo]{grid-template-columns:minmax(0,1fr)}
  .grip,.ratio,#btn-both{display:none}
  .split:not([data-solo="swagger"]) #pane-swagger{display:none}
  .split[data-solo="swagger"] #pane-ppi{display:none}
}
</style>

<header class="bar">
  <span class="brand">PPI ⟷ Swagger</span>
  <span class="ratio" id="ratio">50 / 50</span>
  <div class="labels" role="group" aria-label="View">
    <button id="btn-ppi" type="button" aria-pressed="false">PPI only</button>
    <button id="btn-both" type="button" aria-pressed="true">Side by side</button>
    <button id="btn-swagger" type="button" aria-pressed="false">Swagger only</button>
  </div>
</header>

<main class="split" id="split">
  <section class="pane" id="pane-ppi">
    <div class="pane-head"><b>PPI</b><span>Naval Radar Geometry</span></div>
    <iframe src="ppi.html" title="PPI radar display"></iframe>
  </section>
  <div class="grip" id="grip" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50"></div>
  <section class="pane" id="pane-swagger">
    <div class="pane-head"><b>Swagger</b><span>API Studio</span></div>
    <iframe src="swagger.html" title="Swagger API Studio"></iframe>
  </section>
</main>

<script>
(function(){
  var split=document.getElementById('split'),grip=document.getElementById('grip'),ratio=document.getElementById('ratio');
  var btns={ppi:document.getElementById('btn-ppi'),both:document.getElementById('btn-both'),swagger:document.getElementById('btn-swagger')};
  function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function setLeft(p){p=Math.max(20,Math.min(80,p));split.style.setProperty('--left',p+'%');ratio.textContent=Math.round(p)+' / '+Math.round(100-p);grip.setAttribute('aria-valuenow',Math.round(p));save('split.left',p)}
  function setMode(m){if(m==='both')split.removeAttribute('data-solo');else split.setAttribute('data-solo',m);
    for(var k in btns)btns[k].setAttribute('aria-pressed',String(k===m));save('split.mode',m)}
  for(var k in btns)(function(k){btns[k].addEventListener('click',function(){setMode(k)})})(k);
  grip.addEventListener('pointerdown',function(e){grip.setPointerCapture(e.pointerId);grip.classList.add('drag');split.classList.add('dragging')});
  grip.addEventListener('pointermove',function(e){if(!grip.classList.contains('drag'))return;var r=split.getBoundingClientRect();setLeft((e.clientX-r.left)/r.width*100)});
  function end(){grip.classList.remove('drag');split.classList.remove('dragging')}
  grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);
  grip.addEventListener('dblclick',function(){setLeft(50)});
  grip.addEventListener('keydown',function(e){var cur=parseFloat(grip.getAttribute('aria-valuenow'));
    if(e.key==='ArrowLeft'){setLeft(cur-5);e.preventDefault()}else if(e.key==='ArrowRight'){setLeft(cur+5);e.preventDefault()}});
  setLeft(parseFloat(load('split.left','50'))||50);
  var m=load('split.mode','both');setMode(btns[m]?m:'both');
})();
</script>
